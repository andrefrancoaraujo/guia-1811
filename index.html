<script>
(function(){
  const blob = JSON.parse(document.getElementById("blob").textContent);
  const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function open(pass){
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt: ub(blob.s), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: ub(blob.i)}, key, ub(blob.c));
    return new TextDecoder().decode(pt);
  }
  function mount(html){
    const root = document.getElementById("root");
    const tpl = document.createElement("template"); tpl.innerHTML = html;
    tpl.content.querySelectorAll("link[rel=stylesheet]").forEach(l => document.head.appendChild(l));
    const scripts = [...tpl.content.querySelectorAll("script")].map(s => { const c = s.textContent; s.remove(); return c; });
    tpl.content.querySelectorAll("title,meta").forEach(e => e.remove());
    root.appendChild(tpl.content);
    document.getElementById("gate").hidden = true; root.hidden = false;
    scripts.forEach(c => { const s = document.createElement("script"); s.textContent = c; document.body.appendChild(s); });
  }
  const form = document.getElementById("f"), err = document.getElementById("err");
  form.addEventListener("submit", async e => {
    e.preventDefault(); err.textContent = "";
    const pass = document.getElementById("pw").value.trim().toUpperCase();
    try { const html = await open(pass); try{ localStorage.setItem("guia-pass", pass); }catch(_){} mount(html); }
    catch(_) { err.textContent = "Senha errada. É o nome do evento, sem espaço."; }
  });
  try { const saved = localStorage.getItem("guia-pass"); if (saved) open(saved).then(mount).catch(()=>{}); } catch(_) {}
})();
</script>
